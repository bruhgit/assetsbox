name: Release Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify version metadata
        run: npm run release:check

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Assetsbox v__VERSION__
          releaseBody: |
            Windows installer for Assetsbox.

            Every provider download now requires a locally recorded license acceptance. Review the official asset listing and its terms before use.
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          args: --bundles nsis
